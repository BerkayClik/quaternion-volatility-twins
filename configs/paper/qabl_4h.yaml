# Quaternion ablation, single-coin 4h: encoder algebra (quaternion hq_ vs real hl_)
# x fusion algebra (Hamilton meta / learned PHM / dense / concat / group attention).
name: qabl_4h
datasets: [btc_4h, bnb_4h, eth_4h, sol_4h, xrp_4h]
tasks: [range]
groupsets:
  PMSE: [price, market, social, sentiment]
models: [hq_phm, hq_dense, hl_concat, hl_gattn, hl_meta, hl_phm, hl_dense]
seeds: [0, 1, 2, 3, 4]
window: {4h: 42}
folds: {n: 4, test_days: 90, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
