# Advisor's 16 -> 12 -> 8 -> 4 feature ablation and TA-Lib group swaps (range task).
name: ablation
datasets: [btc_1d, bnb_1d, eth_1d, sol_1d, btc_4h, bnb_4h, eth_4h, sol_4h, xrp_4h]
tasks: [range]
groupsets:
  PM: [price, market]
  PMS: [price, market, social]
  PMTE: [price, market, technical, sentiment]
  PMST: [price, market, social, technical]
  PTSE: [price, technical, social, sentiment]
models: [ridge, lstm, qlstm, hq_concat, hq_meta]
seeds: [0, 1, 2]
window: {1d: 30, 4h: 42}
folds: {n: 4, test_days: 90, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
