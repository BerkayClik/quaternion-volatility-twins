# V4 third round, earlier period (plan in experiments/paper_v4_round3.py, committed before the run): the frozen system
# on four test blocks of 135 days that end where the first test block of the paper begins (30 October 2023 to
# 22 April 2025), a period for which no forecast was ever evaluated. Exchange data only, samples from 2020-01-01.
name: v4_early_new_pool_4h
datasets: [shib_4h, near_4h, rune_4h, fet_4h, fil_4h, hbar_4h, inj_4h, uni_4h, icp_4h, etc_4h, aave_4h, crv_4h, stx_4h, trb_4h, ar_4h]
tasks: [range]
exchange_only: true
start: "2020-01-01"
groupsets:
  PRMC: [price_r, market, calendar]
models: []
pooled_models: [hq_gattn, hl_gattn, transformer]
seeds: [0, 1, 2, 3, 4]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180, end: "2025-04-22 16:00"}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
