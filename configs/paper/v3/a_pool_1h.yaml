# V3 grid for candidate A (2026-11-18, fixed before any run; all files a_*.yaml were committed together).
# Candidate A: hq_gattn on price with range, market and calendar (gattn_range_pool_4h.yaml); hl_gattn is
# its real twin. Same folds, budget and training protocol as the paper unless a line says otherwise.
# Hourly bars (sample from 2023, as cal_pool_1h.yaml of the paper).
name: v3_a_pool_1h
start: "2023-01-01"
datasets: [btc_1h, eth_1h, sol_1h, bnb_1h, xrp_1h, ada_1h, doge_1h, link_1h, ltc_1h, dot_1h, avax_1h, trx_1h, bch_1h, xlm_1h, atom_1h]
tasks: [range]
groupsets:
  PRMC: [price_r, market, calendar]
models: []
pooled_models: [hq_gattn, hl_gattn]
seeds: [0, 1, 2]
window: {1h: 48}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
