# V3 cascade of gradient boosting and the network (asked for by the advisor, 2026-11-18; fixed before the run).
# Stage 1 is the lagged LightGBM-S of the paper (pooled, exchange features, three seeds averaged). Stage 2 is
# candidate A (configs/paper/v3/gattn_range_pool_4h.yaml: same inputs, models, seeds, folds, budget and
# training protocol) with ONE change: its target is the residual y - stage 1, and its forecast is stage 1 plus
# the network (key offset_dir; experiments/paper_v3_cascade.py writes the stage-1 forecasts, out of fold over
# five blocks of time on the training rows). Nothing is tuned.
# Read with experiments/paper_v3_cascade.py eval: the cascade against candidate A, against the lagged
# LightGBM-S and against the plain average of the two (blend_avg of tables/v3_hybrid.csv, 0.814 x HAR).
name: v3_a_cascade_pool_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
offset_dir: offsets/v3_cascade_4h
groupsets:
  PRMC: [price_r, market, calendar]
models: []
pooled_models: [hq_gattn, hl_gattn]
seeds: [0, 1, 2]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
