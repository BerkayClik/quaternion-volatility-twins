# V3 grid for candidate A (2026-11-18, fixed before any run). Benchmark networks on the inputs of the
# candidate (price with range, market, calendar: 12 features), so that the comparison is on equal
# information: three recent time-series models, reimplemented (src/models/modern_baselines.py: DLinear,
# a patch Transformer after PatchTST, an inverted Transformer after iTransformer), the flat Transformer
# of the paper and the convolutional pair with six convolutions (the real CNN is sized to the parameter
# count of the quaternion CNN, as in the paper). Same folds, budget and training protocol.
name: v3_a_baselines_pool_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PRMC: [price_r, market, calendar]
models: []
pooled_models: [dlinear, patchtst, itransformer, transformer, qcnn-L6, cnn-L6]
match: {cnn-L6: qcnn-L6}
seeds: [0, 1, 2]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
