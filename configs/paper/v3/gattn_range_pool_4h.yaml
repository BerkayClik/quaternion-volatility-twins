# V3 candidate A (2026-11-17, fixed before any run). The first calendar design of stage 1
# (final/calendar_pool_4h.yaml: price, market and calendar groups, attention fusion over the group
# summaries, one layer, exchange data only; quaternion model 0.827 x HAR, real twin 0.823) with ONE
# change: the log range of the current bar is the real part of the price quaternion (group price_r)
# in place of the constant zero. In the stage-1 control this input lowered the MSE of eight pooled
# models by 0.6-2.1% (tables/v2_rangein.csv). Same folds, seeds, budget and training protocol.
# Whether this candidate or the stage-1 design is taken is decided on the validation blocks, not on
# the test blocks; either choice is to be confirmed on bars after 14 October 2026.
name: v3_gattn_range_pool_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PRMC: [price_r, market, calendar]
models: []
pooled_models: [hq_gattn, hl_gattn]
seeds: [0, 1, 2]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
