# V3 grid for candidate A: effect of the data types (2026-11-20, asked for by the advisor; plan in
# experiments/paper_v3_inputs.py; fixed and committed before any of these runs).
# Candidate A: hq_gattn on price with range, market and calendar; hl_gattn is its real twin. Same folds, budget
# and training protocol as the paper.
# One data type added to the inputs of candidate A: technical indicators (PRMTC); the social group (PRMSC).
name: v3_a_types_ts_pool_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PRMTC: [price_r, market, technical, calendar]
  PRMSC: [price_r, market, social, calendar]
models: []
pooled_models: [hq_gattn, hl_gattn]
seeds: [0, 1, 2, 3, 4]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
