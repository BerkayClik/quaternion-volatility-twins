# Pooled 4h: Transformer baseline, and the meta-quaternion group-to-component
# mapping check (main order PMSE = price->r, market->i, social->j, sentiment->k;
# here the four cyclic shifts of that order).
name: pool_4h_extra
datasets: [btc_4h, bnb_4h, eth_4h, sol_4h, xrp_4h]
tasks: [range]
groupsets:
  P: [price]
  PMSE: [price, market, social, sentiment]
  MSEP: [market, social, sentiment, price]
  SEPM: [social, sentiment, price, market]
  EPMS: [sentiment, price, market, social]
models: []
pooled_models: [transformer, hq_meta]
seeds: [0, 1, 2, 3, 4]
window: {4h: 42}
folds: {n: 4, test_days: 90, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
