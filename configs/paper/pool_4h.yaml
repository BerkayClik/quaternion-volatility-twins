# Cross-coin pooled training (4-hourly). All 4h coins end 2026-02-12 20:00, so
# folds match configs/paper/main.yaml and single-coin results come from there.
name: pool_4h
datasets: [btc_4h, bnb_4h, eth_4h, sol_4h, xrp_4h]
tasks: [range]
groupsets:
  P: [price]
  PMSE: [price, market, social, sentiment]
models: []
pooled_models: [lstm, qlstm, hq_concat, hq_meta]
seeds: [0, 1, 2, 3, 4]
window: {4h: 42}
folds: {n: 4, test_days: 90, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
