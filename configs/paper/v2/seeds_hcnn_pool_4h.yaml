# V2 review round 2: seven more seeds (3-9) of the hierarchical CNN pair with two convolutions, the
# pair with the largest difference in favour of the quaternion model (0.971 with seeds 0-2, all 15
# coins, not significant), to see whether that difference is a property of the seeds. Seeds 0-2 are
# in depth_pool_4h.yaml. Fixed before any run.
name: v2_seeds_hcnn_pool_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PMSE: [price, market, social, sentiment]
models: []
pooled_models: [hqc_meta-L2, hc_meta-L2]
match: {hc_meta-L2: hqc_meta-L2}
seeds: [3, 4, 5, 6, 7, 8, 9]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
