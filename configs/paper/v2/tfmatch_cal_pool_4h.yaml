# V2 review round 2 (isolating control of the attention pairs): the matched real Transformer twins
# (GELU, two heads or a free encoder width, as the quaternion models) with the calendar term. The
# versions without the calendar term are in final/twinmatch_pool_4h.yaml. Each real twin is sized
# to the parameter count of its quaternion twin. Fixed before any run.
name: v2_tfmatch_cal_pool_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PMSEC: [price, market, social, sentiment, calendar]
models: []
pooled_models: [transformer_g+cal, htg_meta+cal]
match: {transformer_g+cal: qtransformer+cal, htg_meta+cal: hqt_meta+cal}
seeds: [0, 1, 2]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
