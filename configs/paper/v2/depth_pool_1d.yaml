# V2 confirmation: depth and convolutional twins on daily bars, pooled (protocol of final/pool_1d.yaml).
name: v2_depth_pool_1d
datasets: [btc_1d, eth_1d, sol_1d, bnb_1d, xrp_1d, ada_1d, doge_1d, link_1d, ltc_1d, dot_1d, avax_1d, trx_1d, bch_1d, xlm_1d, atom_1d]
tasks: [range]
groupsets:
  PMSE: [price, market, social, sentiment]
models: [har]
pooled_models: [lstm, qlstm, hl_meta, hq_meta, lstm-L2, qlstm-L2, hl_meta-L2, hq_meta-L2,
                cnn-L6, qcnn-L6, hc_meta, hqc_meta]
match: {lstm-L2: qlstm-L2, hl_meta-L2: hq_meta-L2, cnn-L6: qcnn-L6, hc_meta: hqc_meta}
seeds: [0, 1, 2]
window: {1d: 30}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
