# V2 review round 1 (REV-16): seeds 1-2 of the pooled LightGBM-S with all 16 features, so that with seed 0
# (final/lgbm_1h.yaml) the benchmark is a three-seed average like the networks. The seed sets the 0.8 row
# and column subsampling. Runs on a CPU in seconds.
name: v2_lgbm_seeds_1h
start: "2023-01-01"
datasets: [btc_1h, eth_1h, sol_1h, bnb_1h, xrp_1h, ada_1h, doge_1h, link_1h, ltc_1h, dot_1h, avax_1h, trx_1h, bch_1h, xlm_1h, atom_1h]
tasks: [range]
groupsets:
  PMSE: [price, market, social, sentiment]
models: []
pooled_models: [lgbms]
seeds: [1, 2]
window: {1h: 48}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
