# V2 control: the temporal CNN twins at a lower learning rate (as final/lr3e4_pool_4h.yaml for the
# other families). At 1e-3 every CNN reaches its best validation epoch within the first four epochs.
name: v2_cnn_lr3e4_pool_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PMSE: [price, market, social, sentiment]
models: []
pooled_models: [cnn-L2, qcnn-L2, cnn, qcnn, cnn-L6, qcnn-L6, hc_meta-L2, hqc_meta-L2, hc_meta, hqc_meta]
match: {cnn-L2: qcnn-L2, cnn: qcnn, cnn-L6: qcnn-L6, hc_meta-L2: hqc_meta-L2, hc_meta: hqc_meta}
seeds: [0, 1, 2]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.0003, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
