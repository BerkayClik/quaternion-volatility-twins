# V2 review round 1 (REV-16): seeds 1-2 of the pooled LightGBM-S with all 16 features, so that with seed 0
# (final/lgbm_4h.yaml) the benchmark is a three-seed average like the networks. The seed sets the 0.8 row
# and column subsampling. Runs on a CPU in seconds.
name: v2_lgbm_seeds_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PMSE: [price, market, social, sentiment]
models: []
pooled_models: [lgbms]
seeds: [1, 2]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
