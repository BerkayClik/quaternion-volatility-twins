# Manuscript v5, check 5 of experiments/paper_v5_round5.py (2026-11-28, fixed before any run): the real twin of the
# network matched in the two respects in which it differs from the quaternion network besides the algebra.
#   hlp_gattn   H-LSTM with a learned H -> H projection per group before the attention layer (the quaternion
#               encoders have a 4H -> H projection, the twin of the paper none); H = 34, 19,960 parameters
#   hlpg_gattn  the same with the initialisation of the quaternion layers in the recurrent weights (normal Glorot,
#               zero biases)
# Inputs, folds, budget, protocol and seeds of the network of the paper (gattn_range_pool_4h.yaml, a_seeds_pool_4h.yaml).
name: v5_twinctl_pool_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PRMC: [price_r, market, calendar]
models: []
pooled_models: [hlp_gattn, hlpg_gattn]
seeds: [0, 1, 2, 3, 4]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
