# Noise robustness (pooled 4h): replace informative groups by synthetic persistent,
# heavy-tailed noise groups and measure each architecture's degradation.
name: pool_4h_noise
datasets: [btc_4h, bnb_4h, eth_4h, sol_4h, xrp_4h]
tasks: [range]
groupsets:
  PM: [price, market]
  PMN: [price, market, noise]
  PMNN: [price, market, noise, noise2]
models: []
pooled_models: [lstm, qlstm, transformer, hq_concat, hl_concat, hq_meta, hl_meta]
seeds: [0, 1, 2]
window: {4h: 42}
folds: {n: 4, test_days: 90, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
