# Reviewer-requested baselines on the main grid: GARCH(1,1), GJR-GARCH, Transformer encoder.
name: extra
datasets: [btc_1d, bnb_1d, eth_1d, sol_1d, btc_4h, bnb_4h, eth_4h, sol_4h, xrp_4h]
tasks: [range, return]
groupsets:
  P: [price]
  PMSE: [price, market, social, sentiment]
models: [garch, gjr, transformer]
seeds: [0, 1, 2, 3, 4]
window: {1d: 30, 4h: 42}
folds: {n: 4, test_days: 90, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
