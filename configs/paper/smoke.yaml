name: smoke
datasets: [btc_1d, btc_4h]
tasks: [range, return]
groupsets:
  P: [price]
  PMSE: [price, market, social, sentiment]
models: [persistence, mean, har, ridge, lstm, qlstm, qlstm_attn, hq_concat, hq_meta, hq_meta_attn]
seeds: [0]
window: {1d: 30, 4h: 42}
folds: {n: 2, test_days: 90, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 3, patience: 2, grad_clip: 1.0}
