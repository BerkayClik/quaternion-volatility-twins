# FINAL (review): random 4x4 partitions, single-coin H-LSTM.
name: final_randgroups_single_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  R1: [rand1_0, rand1_1, rand1_2, rand1_3]
  R2: [rand2_0, rand2_1, rand2_2, rand2_3]
  R3: [rand3_0, rand3_1, rand3_2, rand3_3]
models: [hl_meta]
seeds: [0, 1, 2]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
