# FINAL (round 5): seeds 1-2 of the pooled LightGBM-S (PM), so with final_lgbm_4h (seed 0) it is a 3-seed average;
# the seed sets the 0.8 row/column subsampling (random_state). Same folds, design and early stopping.
name: final_lgbm_seeds_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PM: [price, market]
models: []
pooled_models: [lgbms]
seeds: [1, 2]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
