# FINAL (Deep Review 2): ridge on the input window with the log range in the price
# quaternion (42 lags of the target nest the 4h HAR regressors). Baseline: final_single_4h.
name: final_rangein_single_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PR: [price_r]
  PRMSE: [price_r, market, social, sentiment]
models: [ridge]
seeds: [0]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
