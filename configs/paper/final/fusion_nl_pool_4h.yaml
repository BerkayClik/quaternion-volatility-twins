# FINAL: nonlinear fusion (tanh after the fusion's mixing layer), pooled 4h, PMSE.
# Linear counterparts come from final_pool_4h / final_ablation_pool_4h.
name: final_fusion_nl_pool_4h
datasets: [btc_4h, eth_4h, sol_4h, bnb_4h, xrp_4h, ada_4h, doge_4h, link_4h, ltc_4h, dot_4h, avax_4h, trx_4h, bch_4h, xlm_4h, atom_4h]
tasks: [range]
groupsets:
  PMSE: [price, market, social, sentiment]
models: []
pooled_models: [hq_metan, hl_metan, hq_phmn, hl_phmn, hq_densen, hl_densen, hqt_metan, ht_metan]
seeds: [0, 1, 2]
window: {4h: 42}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
