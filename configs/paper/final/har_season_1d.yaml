# FINAL: stronger linear benchmarks (review): HAR/HAR-X with calendar dummies, and
# panel (pooled) HAR/HAR-X/seasonal variants on per-coin standardised data.
name: final_har_season_1d
datasets: [btc_1d, eth_1d, sol_1d, bnb_1d, xrp_1d, ada_1d, doge_1d, link_1d, ltc_1d, dot_1d, avax_1d, trx_1d, bch_1d, xlm_1d, atom_1d]
tasks: [range]
groupsets:
  PMSE: [price, market, social, sentiment]
models: [hars, harxs]
pooled_models: [har, harx, hars, harxs]
seeds: [0]
window: {1d: 30}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
