# FINAL (data snapshot 2026-10-15): single-coin models, 15 coins, 1h.
name: final_single_1h
start: "2023-01-01"
datasets: [btc_1h, eth_1h, sol_1h, bnb_1h, xrp_1h, ada_1h, doge_1h, link_1h, ltc_1h, dot_1h, avax_1h, trx_1h, bch_1h, xlm_1h, atom_1h]
tasks: [range]
groupsets:
  P: [price]
  PMSE: [price, market, social, sentiment]
models: [persistence, mean, har, ridge, garch, gjr, lstm, qlstm, transformer, qtransformer, hl_meta, hq_meta, ht_meta, hqt_meta]
seeds: [0, 1, 2]
window: {1h: 48}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
