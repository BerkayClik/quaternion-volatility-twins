# FINAL: pooled cross-coin models (per-coin standardization), 15 coins, 1d.
name: final_pool_1d
datasets: [btc_1d, eth_1d, sol_1d, bnb_1d, xrp_1d, ada_1d, doge_1d, link_1d, ltc_1d, dot_1d, avax_1d, trx_1d, bch_1d, xlm_1d, atom_1d]
tasks: [range]
groupsets:
  P: [price]
  PM: [price, market]
  PMSE: [price, market, social, sentiment]
models: []
pooled_models: [lstm, qlstm, transformer, qtransformer, hl_meta, hq_meta, ht_meta, hqt_meta, hl_gattn, hq_gattn, ht_concat, hqt_concat]
seeds: [0, 1, 2, 3, 4]
window: {1d: 30}
folds: {n: 4, test_days: 135, val_days: 180}
budget: 20000
train: {lr: 0.001, batch_size: 128, max_epochs: 150, patience: 10, grad_clip: 1.0}
